name: Build and publish release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: 

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: |
          dotnet restore BackspaceClient.Desktop/BackspaceClient.Desktop.csproj
          dotnet restore BackspaceClient.Game.Tests/BackspaceClient.Game.Tests.csproj

      - name: Build (Release)
        run: |
          dotnet build BackspaceClient.Desktop/BackspaceClient.Desktop.csproj --configuration Release --no-restore
          dotnet build BackspaceClient.Game.Tests/BackspaceClient.Game.Tests.csproj --configuration Release --no-restore

      - name: Test
        run: dotnet test BackspaceClient.Game.Tests/BackspaceClient.Game.Tests.csproj --configuration Release --no-build --verbosity normal

      - name: Publish binary
        run: dotnet publish BackspaceClient.Desktop/BackspaceClient.Desktop.csproj --configuration Release --no-build -o publish
      - name: Compress binaries
        run: tar -czf release-linux-amd64.tar.gz -C publish .

      - name: Create release and upload binary
        uses: softprops/action-gh-release@v3
        with:
          files: release-linux-amd64.tar.gz
          generate_release_notes: true
